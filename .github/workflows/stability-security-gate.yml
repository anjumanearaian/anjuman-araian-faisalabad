name: Stability & Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stability-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locked-invariants:
    name: Locked invariants, auth regression and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Check locked security and stability invariants
        run: npm run stability:check

      - name: Run authentication regression suite
        run: npm run test:auth

      - name: Block critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Build production bundle
        run: npm run build
